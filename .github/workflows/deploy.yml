name: Deploy to GitHub Pages

# Publishes the built game (dist/) to GitHub Pages whenever master changes.
# One-time setup in the repository: Settings > Pages > Build and deployment > Source: GitHub Actions.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish, but skip older queued ones in favour of the newest.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the game
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish to GitHub Pages
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
